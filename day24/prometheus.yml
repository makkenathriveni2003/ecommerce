# ==============================================================================
# ShopZone Day 24 - Prometheus Scrape Configuration
# Collects operational metrics from the FastAPI backend at /metrics
# ==============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: "shopzone-backend"
    metrics_path: "/metrics"
    scheme: "http"
    static_configs:
      - targets: ["backend:8000"]
        labels:
          application: "shopzone"
          environment: "production"
          service: "backend-api"

  - job_name: "nginx-reverse-proxy"
    metrics_path: "/metrics"
    scheme: "http"
    static_configs:
      - targets: ["nginx:80"]
        labels:
          application: "shopzone"
          environment: "production"
          service: "nginx"
