# ============================================================================
# ShopZone - Production Docker Compose Stack (AWS / Cloud Deployment)
# Hardened multi-container configuration for AWS EC2 / ECS / App Runner
# ============================================================================

version: "3.8"

networks:
  shopzone-network:
    driver: bridge
    name: shopzone-prod-network

volumes:
  postgres_prod_data:
    name: shopzone_postgres_prod_data
  redis_prod_data:
    name: shopzone_redis_prod_data
  chroma_prod_data:
    name: shopzone_chroma_prod_data
  app_prod_logs:
    name: shopzone_app_prod_logs

services:
  postgres:
    image: postgres:16-alpine
    container_name: shopzone-prod-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-shopzone_prod}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - shopzone-network
    # In production, DB port is NOT exposed publicly on host
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-shopzone_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: shopzone-prod-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-prodsecret}"]
    volumes:
      - redis_prod_data:/data
    networks:
      - shopzone-network
    # In production, Redis is NOT exposed publicly
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-prodsecret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: Dockerfile.backend
    container_name: shopzone-prod-backend
    restart: always
    env_file:
      - .env.production.example
    networks:
      - shopzone-network
    volumes:
      - app_prod_logs:/app/logs
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  celery_worker:
    build:
      context: ..
      dockerfile: Dockerfile.backend
    container_name: shopzone-prod-celery-worker
    restart: always
    command: ["celery", "-A", "backend.app.tasks.celery_app", "worker", "--loglevel=warning", "-c", "4"]
    env_file:
      - .env.production.example
    networks:
      - shopzone-network
    volumes:
      - app_prod_logs:/app/logs
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: Dockerfile.frontend
    container_name: shopzone-prod-frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    networks:
      - shopzone-network
    depends_on:
      backend:
        condition: service_healthy
