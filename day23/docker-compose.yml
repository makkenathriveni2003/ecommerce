
services:
  postgres:
    image: postgres:16-alpine
    container_name: thriveni-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shopzone}
      POSTGRES_USER: ${POSTGRES_USER:-shopzone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shopzone_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: thriveni-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  chromadb:
    image: chromadb/chroma:latest
    container_name: thriveni-chromadb
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma

  backend:
    image: thriveni-backend:latest
    build:
      context: ..
      dockerfile: day23/Dockerfile.backend
    container_name: thriveni-backend
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
    volumes:
      - app_logs:/app/logs
      - app_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  celery_worker:
    image: thriveni-backend:latest
    build:
      context: ..
      dockerfile: day23/Dockerfile.backend
    container_name: thriveni-celery-worker
    restart: unless-stopped
    env_file:
      - .env.docker
    command: ["celery", "-A", "backend.app.tasks.celery_app", "worker", "--loglevel=info", "--pool=solo"]
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_logs:/app/logs
      - app_uploads:/app/uploads
    healthcheck:
      disable: true

  celery_beat:
    image: thriveni-backend:latest
    build:
      context: ..
      dockerfile: day23/Dockerfile.backend
    container_name: thriveni-celery-beat
    restart: unless-stopped
    env_file:
      - .env.docker
    command: ["celery", "-A", "backend.app.tasks.celery_app", "beat", "--loglevel=info"]
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_logs:/app/logs
    healthcheck:
      disable: true

  frontend:
    image: thriveni-frontend:latest
    build:
      context: ..
      dockerfile: day23/Dockerfile.frontend
    container_name: thriveni-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  chroma_data:
  app_logs:
  app_uploads:
